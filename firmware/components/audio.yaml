# Audio Addon

esp32:
  framework:
    components:
      # Required for AEC (esp_aec component)
      - espressif/esp-sr^2.3.0

external_components:
  - source:
      type: git
      url: https://github.com/n-IA-hane/intercom-api
      ref: main
      path: esphome_components
    components: [intercom_api, i2s_audio_duplex, esp_aec]


script:
  - id: !extend boot_component_init
    then:
      # Restore ES8388 volume and sync AEC reference
      # AEC reference must match ES8388 hardware output level
      - lambda: |-
          float vol = 0.15 + (id(speaker_volume).state / 100.0) * 0.60;
          id(es8388_dac).set_volume(vol);
          id(i2s_duplex).set_aec_reference_volume(vol);

