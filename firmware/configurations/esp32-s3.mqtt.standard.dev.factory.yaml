# Doorman Standard Firmware (MQTT)
# Base Board ESP32-S3

# ESPHome Dashboard import is not supported in this
# firmware, as it requires the API.
# Available only via the Home Assistant API integration.

# You can change a few options here.
substitutions:
  name: "doorman-s3"
  friendly_name: "Doorman S3"
  ap_password: "Op3n-Sesame!"
  # DO NOT CHANGE - INTERNALLY USED
  branch: "dev"
  firmware_type: "standard"
  api_variant: "mqtt"
  host_platform: "esp32-s3"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"

packages:
  host: !include ../packages/host/esp32-s3.yaml
  rgb_status_led: !include ../packages/common/rgb-status-led.ws2812b.yaml
  rgb_status_led_effects: !include ../packages/common/rgb-status-led.effects.yaml
  external_components: !include ../packages/common/external-components.yaml
  base: !include ../packages/common/base.yaml
  wifi: !include ../packages/common/wifi.yaml
  bluedroid_ble: !include ../packages/common/bluedroid-ble.yaml
  ota_update_esphome: !include ../packages/ota/esphome.yaml
  ota_update_http: !include ../packages/ota/http.yaml
  api: !include ../packages/api/mqtt.yaml
  debug_utilities: !include ../packages/debug/debug-utilities.yaml
  debug_component: !include ../packages/debug/debug-component.yaml
  debug_component_psram: !include ../packages/debug/debug-component.psram.yaml
  pattern_events: !include ../packages/pattern_events/pattern-events.yaml
  ring_to_open: !include ../packages/ring_to_open/ring-to-open.yaml
  indoor_station_settings: !include ../packages/bus_devices/indoor-station-settings.yaml
  interactive_setup: !include ../packages/bus_devices/interactive-setup.yaml