# Doorman Nuki Bridge Firmware (Home Assistant)
# Base Board DOORMAN-S3-REV2-AUDIO

# You can change a few options here.
substitutions:
  name: "doorman-s3"
  friendly_name: "Doorman S3"
  ap_password: "Op3n-Sesame!"
  # DO NOT CHANGE - INTERNALLY USED
  branch: "master"
  firmware_type: "nuki-bridge"
  api_variant: "ha"
  host_platform: "doorman-s3-rev2-audio"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"

dashboard_import:
  package_import_url: github://azoninc/doorman/firmware/configurations/${host_platform}.${api_variant}.${firmware_type}.${branch}.yaml@${branch}
  import_full_config: true

packages:
  host: !include ../packages/host/${host_platform}.yaml
  rgb_status_led: !include ../packages/common/rgb-status-led.yaml
  solid_state_relay: !include ../packages/common/relay.yaml
  extension_board: !include ../packages/extension_boards/common.yaml
  extension_board_audio: !include ../packages/extension_boards/audio-intercom.yaml
  external_components: !include ../packages/common/external-components.yaml
  base: !include ../packages/common/base.yaml
  wifi: !include ../packages/common/wifi.yaml
  wifi_psram: !include ../packages/common/wifi.psram.yaml
  ota_update_esphome: !include ../packages/ota/esphome.yaml
  ota_update_http: !include ../packages/ota/http.yaml
  api: !include ../packages/api/homeassistant.yaml
  pattern_events: !include ../packages/pattern_events/pattern-events.yaml
  ring_to_open: !include ../packages/ring_to_open/ring-to-open.yaml
  ring_to_open_nuki: !include ../packages/ring_to_open/ring-to-open-nuki.yaml
  indoor_station_settings: !include ../packages/bus_devices/indoor-station-settings.yaml
  addon_nuki_bridge: !include ../packages/nuki/nuki-bridge.yaml
  interactive_setup: !include ../packages/bus_devices/interactive-setup.yaml