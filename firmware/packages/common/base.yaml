binary_sensor:
  - platform: gpio
    id: doorman_boot_button
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true
      ignore_strapping_warning: true
    internal: true
    on_multi_click:
      # Single press
      - timing:
          - ON for at most 0.5s
          - OFF for at least 1.8s
        then:
          - event.trigger:
              id: doorman_boot_button_event
              event_type: single_press
      # Double press
      - timing:
          - ON for at most 0.5s
          - OFF for at most 1s
          - ON for at most 0.5s
          - OFF for at least 1.7s
        then:
          - event.trigger:
              id: doorman_boot_button_event
              event_type: double_press
      # Long press
      - timing:
          - ON for at least 5s
        then:
          - event.trigger:
              id: doorman_boot_button_event
              event_type: long_press

  - platform: gpio
    id: doorman_external_button
    pin:
      number: ${external_button_pin}
      mode:
        pullup: true
        input: true
      inverted: true
    internal: true
    on_multi_click:
      # Single press
      - timing:
          - ON for at most 0.5s
          - OFF for at least 1.8s
        then:
          - event.trigger:
              id: doorman_external_button_event
              event_type: single_press
      # Double press
      - timing:
          - ON for at most 0.5s
          - OFF for at most 1s
          - ON for at most 0.5s
          - OFF for at least 1.7s
        then:
          - event.trigger:
              id: doorman_external_button_event
              event_type: double_press
      # Long press
      - timing:
          - ON for at least 5s
        then:
          - event.trigger:
              id: doorman_external_button_event
              event_type: long_press

  - platform: gpio
    id: et_detect
