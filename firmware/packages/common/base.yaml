# Essential ESPHome Configuration Options
esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  min_version: "2026.6.0"
  project:
    name: AzonInc.Doorman Standard
    version: 2026.6.0
  name_add_mac_suffix: false
  on_boot:
    - priority: 500.0
      then:
        - script.execute: boot_component_init
    - priority: 350.0
      then:
        - script.execute: set_unused_entities_internal

  devices:
    - id: tc_bus_general
      name: "TC:BUS"
      
    - id: tc_bus_is
      name: "TC:BUS Indoor Station"

# Enable logging
logger:
  id: esphome_logger
  level: DEBUG
  initial_level: INFO
  runtime_tag_levels: true

web_server:
  js_url: "${ 'https://doorman.azon.ai/firmware/esphome-webserver/www.js' if branch == 'master' else 'https://dev.doorman.azon.ai/firmware/esphome-webserver/www.js' if branch.startswith('dev') or branch == 'local' else 'https://experimental.doorman.azon.ai/firmware/esphome-webserver/www.js' }"
  version: 3
  sorting_groups:
    - id: sorting_group_controls
      name: "Quick Actions"
      sorting_weight: -100

    - id: sorting_group_setup_status
      name: "Setup"
      sorting_weight: -99

    - id: sorting_group_settings
      name: "Setup: Outdoor Stations"
      sorting_weight: 2

    - id: sorting_group_setup_indoor_station
      name: "Setup: Indoor Station"
      sorting_weight: 4

    - id: sorting_group_indoor_station_settings
      name: "Indoor Station"
      sorting_weight: -89

    - id: sorting_group_indoor_station_ringtone
      name: "Indoor Station: Ringtone"
      sorting_weight: 1

    - id: sorting_group_indoor_station_volume
      name: "Indoor Station: Volume"
      sorting_weight: 2

    - id: sorting_group_settings_advanced
      name: "Advanced"
      sorting_weight: -55

    - id: sorting_group_system
      name: "System"
      sorting_weight: -51

    - id: sorting_group_rgb_status_led
      name: "System: RGB Status LED"
      sorting_weight: 1

    - id: sorting_group_red_status_led
      name: "System: Red Status LED"
      sorting_weight: 2

    - id: sorting_group_debug_tools
      name: "Debug"
      sorting_weight: -30

    - id: sorting_group_debug_log_level
      name: "Debug: Log Level"
      sorting_weight: 1

    - id: sorting_group_debug_discovery
      name: "Debug: Discovery"
      sorting_weight: 2

    - id: sorting_group_updates
      name: "Updates"
      sorting_weight: 0

    - id: sorting_group_information
      name: "Diagnostics"
      sorting_weight: -5

    - id: sorting_group_diagnostics_device_info
      name: "Diagnostics: Device Info"
      sorting_weight: 1

    - id: sorting_group_diagnostics_bus_status
      name: "Diagnostics: Bus Status"
      sorting_weight: 2

    - id: sorting_group_diagnostics_listeners
      name: "Diagnostics: Listeners"
      sorting_weight: 3

    - id: sorting_group_diagnostics_memory
      name: "Diagnostics: Memory"
      sorting_weight: 4

# Setup Improv Serial
improv_serial:

# Setup TC:BUS Component
tc_bus:
  id: tc_bus_id
  rx_pin: ${rx_pin}
  tx_pin:
    number: ${tx_pin}
    drive_strength: 40mA
    mode: OUTPUT
  on_telegram:
    - if:
        condition:
          - switch.is_on: doorman_red_status_led_bus_activity
        then:
          - script.execute: blink_red_status_led

# Setup TC:BUS Device Component
tc_bus_device:
  - id: tc_bus_indoor_station
    type: indoor_station
    auto_configuration: true

