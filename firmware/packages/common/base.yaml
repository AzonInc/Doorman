script:
  - id: boot_component_init
    then:
      - logger.log: "Running boot_component_init script"

  - id: boot_after_api
    then:
      - logger.log: "Running boot_after_api script"

  - id: set_unused_entities_internal
    then:
      - logger.log: "Running set_unused_entities_internal script"

      # Set second entrance door internal if not used
      - lambda: |-
          bool internal = id(second_entrance_door_station_address).state == 63 || id(second_entrance_door_station_address).state == id(entrance_door_station_address).state;
          id(second_entrance_door)->set_internal(internal);
          id(second_entrance_door_before_open_cmds)->set_internal(internal);
          id(second_entrance_doorbell)->set_internal(internal);
          id(second_entrance_doorbell_pattern)->set_internal(internal);

  - id: blink_red_status_led
    mode: restart
    then:
      - light.turn_off:
          id: doorman_red_status_led
          transition_length: 0s
      - light.turn_on:
          id: doorman_red_status_led
          transition_length: 0s
          brightness: !lambda return id(doorman_red_status_led_brightness).state / 100;
      - delay: 60ms
      - light.turn_off:
          id: doorman_red_status_led
          transition_length: 0s

  - id: send_telegram_chain
    parameters:
      telegram_list: string
    then:
      - lambda: |-
          size_t start = 0;
          size_t end;

          while ((end = telegram_list.find(';', start)) != std::string::npos) {
              std::string token = telegram_list.substr(start, end - start);

              // Remove non-hex characters
              token.erase(std::remove_if(token.begin(), token.end(), [](char c) {
                  return !std::isxdigit(static_cast<unsigned char>(c));
              }), token.end());

              if (token.length() == 4 || token.length() == 8) {
                  const char* str = token.c_str();
                  char* endptr = nullptr;
                  errno = 0;  // Reset errno before call
                  unsigned long number = std::strtoul(str, &endptr, 16);

                  // Check if entire string was converted and no errors occurred
                  if (endptr == str + token.size() && errno == 0) {
                      if (token.length() == 8) {
                          id(tc_bus_id)->send_telegram(number, true);
                      } else {
                          id(tc_bus_id)->send_telegram(number);
                      }
                  }
              }
              start = end + 1;
          }

          // Handle last token
          std::string token = telegram_list.substr(start);
          token.erase(std::remove_if(token.begin(), token.end(), [](char c) {
              return !std::isxdigit(static_cast<unsigned char>(c));
          }), token.end());

          if (token.length() == 4 || token.length() == 8) {
              const char* str = token.c_str();
              char* endptr = nullptr;
              errno = 0;
              unsigned long number = std::strtoul(str, &endptr, 16);
              if (endptr == str + token.size() && errno == 0) {
                  if (token.length() == 8) {
                      id(tc_bus_id)->send_telegram(number, true);
                  } else {
                      id(tc_bus_id)->send_telegram(number);
                  }
              }
          }

status_indicator:
  on_turn_off:
    then:
      #- logger.log: "SI: LED OFF"
      - light.turn_off:
          id: doorman_rgb_status_led
          transition_length: 1s
  on_wifi_ap_enabled:
    then:
      #- logger.log: "SI: WiFi AP Enabled"
      - light.turn_on:
          id: doorman_rgb_status_led
          effect: pulse
          red: 100%
          green: 65%
          blue: 0%
  on_wifi_ap_disabled:
    then:
      #- logger.log: "SI: WiFi AP Disabled"
      - light.turn_on:
          id: doorman_rgb_status_led
          effect: slow_pulse
          red: 100%
          green: 65%
          blue: 0%
  on_network_disconnected:
    then:
      #- logger.log: "SI: Network Disconnected"
      - light.turn_on:
          id: doorman_rgb_status_led
          effect: slow_pulse
          red: 100%
          green: 65%
          blue: 0%
  on_custom_status:
    - trigger_id: api_connecting
      priority: 550
      group: api
      then:
        #- logger.log: "SI: API connecting"
        # Regular blue pulse while connecting
        - light.turn_on:
            id: doorman_rgb_status_led
            effect: slow_pulse
            red: 0%
            green: 22%
            blue: 100%

    - trigger_id: api_wait_for_configuration
      priority: 551
      group: api
      then:
        #- logger.log: "SI: API wait for configuration"
        # Red/Blue pulse because broker data is not set
        - light.turn_on:
            id: doorman_rgb_status_led
            effect: error_api

    - trigger_id: api_configured
      priority: 552
      group: api
      then:
        #- logger.log: "SI: API configured"

    - trigger_id: api_connected
      priority: 553
      group: api
      then:
        #- logger.log: "SI: API connected"
        - light.turn_on:
            id: doorman_rgb_status_led
            effect: none
            red: 0%
            green: 22%
            blue: 100%
            #transition_length: 1s
            brightness: !lambda return id(doorman_rgb_status_led_brightness).state / 100;