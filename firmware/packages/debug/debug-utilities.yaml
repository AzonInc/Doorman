# Debug Utilities Addon

esphome:
  devices:
    - id: tc_bus_debug
      name: "TC:BUS Debug Tools"

logger:
  #level: VERBOSE
  level: DEBUG
  initial_level: DEBUG

select:
  - id: !extend esphome_logger_level
    #options:
    #  - "Verbose"
    initial_option: "Debug"
    disabled_by_default: false

  - platform: template
    id: esphome_logger_level_tc_bus
    device_id: tc_bus_debug
    name: "Component Log Level"
    icon: "mdi:math-log"
    optimistic: true
    options:
      - "Disabled"
      - "Error"
      - "Warning"
      - "Info"
      - "Configuration"
      - "Debug"
    #  - "Verbose"
    initial_option: "Debug"
    restore_value: true
    entity_category: CONFIG
    on_value:
      - lambda: |-
          id(esphome_logger).set_log_level("tc_bus", i);
          id(esphome_logger).set_log_level("tc_bus_device", i);
    web_server:
      sorting_group_id: sorting_group_debug_tools
      sorting_weight: -5


binary_sensor:
  - platform: template
    id: debug_bus_connected
    device_id: tc_bus_debug
    name: "Connection Status"
    icon: "mdi:connection"
    lambda: |-
      if (id(debug_bus_voltage).state >= 2.45) {
        return true;
      } else {
        return false;
      }
    entity_category: DIAGNOSTIC
    web_server:
      sorting_group_id: sorting_group_debug_tools

text:
  - platform: template
    id: debug_send_telegram
    device_id: tc_bus_debug
    name: "Send Telegram"
    icon: "mdi:send"
    mode: text
    optimistic: true
    set_action: 
      then: 
        - lambda: |-
            x.erase(std::remove_if(x.begin(), x.end(), [](char c) { return !std::isxdigit(c); }), x.end());
            x.erase(0, x.find_first_not_of('0'));
            x.resize(8);
            unsigned long number = 0;
            if(std::string(x.c_str()) != "") {
              number = std::stoul(x.c_str(), nullptr, 16);
            }
            id(tc_bus_id)->send_telegram(number);
    web_server:
      sorting_group_id: sorting_group_debug_tools

button:
  - platform: tc_bus
    system_discovery:
      id: debug_system_discovery
      device_id: tc_bus_debug
      name: "System Discovery"
      icon: "mdi:home-search"
      entity_category: CONFIG
      on_press: 
        - status.push: system_discovery_active
      web_server:
        sorting_group_id: sorting_group_debug_tools

  - platform: template
    id: debug_restart_control_unit
    device_id: tc_bus_debug
    name: "System Restart"
    icon: mdi:restart
    on_press:
      - tc_bus.send:
          type: reset
    web_server:
      sorting_group_id: sorting_group_debug_tools

  - platform: template
    id: debug_address_discovery
    device_id: tc_bus_debug
    name: "Address Discovery"
    icon: mdi:search
    on_press:
      - status.push: address_discovery_active
      - tc_bus.discover_outdoor_station_addresses:
    web_server:
      sorting_group_id: sorting_group_debug_tools

  - platform: template
    id: debug_floor_call
    device_id: tc_bus_debug
    name: "Test Floor Call"
    icon: mdi:restart
    on_press:
      - tc_bus_device.send:
          id: tc_bus_indoor_station
          type: floor_call
    web_server:
      sorting_group_id: sorting_group_debug_tools

# Extend TC:BUS Component
tc_bus:
  on_system_discovery_complete:
    - status.push: system_discovery_finished
    - lambda: |-
        ESP_LOGD("TAG", "System discovery complete. Device count: %d", x);
    - delay: 3s
    - status.pop:
        group: system_discovery

status_indicator:
  on_custom_status:
    - trigger_id: system_discovery_active
      priority: 400
      group: system_discovery
      then:
        #- logger.log: "SI: System discovery active"
        - light.turn_on:
            id: doorman_rgb_status_led
            red: 100%
            green: 45%
            blue: 83%
            effect: pulse

    - trigger_id: system_discovery_finished
      priority: 401
      group: system_discovery
      then:
        #- logger.log: "SI: System discovery finished"
        - light.turn_on:
            id: doorman_rgb_status_led
            red: 100%
            green: 45%
            blue: 83%
            effect: none
            #transition_length: 1s
            brightness: !lambda return id(doorman_rgb_status_led_brightness).state / 100;

    - trigger_id: address_discovery_active
      priority: 403
      group: address_discovery
      then:
        #- logger.log: "SI: System discovery active"
        - light.turn_on:
            id: doorman_rgb_status_led
            red: 50%
            green: 45%
            blue: 100%
            effect: pulse

    - trigger_id: address_discovery_finished
      priority: 404
      group: address_discovery
      then:
        #- logger.log: "SI: System discovery finished"
        - light.turn_on:
            id: doorman_rgb_status_led
            red: 50%
            green: 45%
            blue: 100%
            effect: none
            #transition_length: 1s
            brightness: !lambda return id(doorman_rgb_status_led_brightness).state / 100;