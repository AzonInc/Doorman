# Outdoor Station Settings Addon

esphome:
  devices:
    - id: tc_bus_os
      name: "TC:BUS Outdoor Station"

web_server:
  sorting_groups:
    - id: sorting_group_outdoor_station_settings
      name: "Settings - TC:BUS Outdoor Station"
      sorting_weight: -69

tc_bus_device:
  - id: tc_bus_outdoor_station
    type: outdoor_station
    auto_configuration: true

number:
  - platform: tc_bus_device
    tc_bus_device_id: tc_bus_outdoor_station
    serial_number:
      id: outdoor_station_serial_number
      device_id: tc_bus_os
      name: "Serial Number"
      icon: "mdi:barcode-scan"
      disabled_by_default: true
      web_server:
        sorting_group_id: sorting_group_outdoor_station_settings
        sorting_weight: -100

    address:
      id: outdoor_station_address
      device_id: tc_bus_os
      name: "Address"
      disabled_by_default: true
      web_server:
        sorting_group_id: sorting_group_outdoor_station_settings
        sorting_weight: -99

    door_readiness_duration:
      id: outdoor_station_door_readiness_duration
      device_id: tc_bus_os
      name: "Door readiness duration"
      disabled_by_default: true
      web_server:
        sorting_group_id: sorting_group_outdoor_station_settings
        sorting_weight: 6

    call_time_duration:
      id: outdoor_station_call_time_duration
      device_id: tc_bus_os
      name: "Call time duration"
      disabled_by_default: true
      web_server:
        sorting_group_id: sorting_group_outdoor_station_settings
        sorting_weight: 7

    door_opener_duration:
      id: outdoor_station_door_opener_duration
      device_id: tc_bus_os
      name: "Door opener duration"
      disabled_by_default: true
      web_server:
        sorting_group_id: sorting_group_outdoor_station_settings
        sorting_weight: 8

select:
  - platform: tc_bus_device
    tc_bus_device_id: tc_bus_outdoor_station
    model:
      id: outdoor_station_model
      device_id: tc_bus_os
      name: "Model"
      icon: "mdi:doorbell-video"
      entity_category: CONFIG
      disabled_by_default: true
      web_server:
        sorting_group_id: sorting_group_outdoor_station_settings
        sorting_weight: -97

switch:
  - platform: tc_bus_device
    tc_bus_device_id: tc_bus_outdoor_station
    address_lock:
      id: outdoor_station_address_lock
      device_id: tc_bus_os
      name: "Address: Lock"
      icon: "mdi:lock"
      entity_category: CONFIG
      disabled_by_default: true
      web_server:
        sorting_group_id: sorting_group_outdoor_station_settings
        sorting_weight: -98

    calling_requires_door_readiness:
      id: outdoor_station_calling_requires_door_readiness
      device_id: tc_bus_os
      name: "Calling requires door readiness"
      icon: "mdi:lock"
      entity_category: CONFIG
      disabled_by_default: true
      web_server:
        sorting_group_id: sorting_group_outdoor_station_settings
        sorting_weight: 3

    door_opener_requires_active_call:
      id: outdoor_station_door_opener_requires_active_call
      device_id: tc_bus_os
      name: "Door opener requires active call"
      icon: "mdi:lock"
      entity_category: CONFIG
      disabled_by_default: true
      web_server:
        sorting_group_id: sorting_group_outdoor_station_settings
        sorting_weight: 4

    door_opener_requires_door_readiness:
      id: outdoor_station_door_opener_requires_door_readiness
      device_id: tc_bus_os
      name: "Door opener requires door readiness"
      icon: "mdi:lock"
      entity_category: CONFIG
      disabled_by_default: true
      web_server:
        sorting_group_id: sorting_group_outdoor_station_settings
        sorting_weight: 5

# Read Memory before reading and writing
button:
  - platform: tc_bus_device
    tc_bus_device_id: tc_bus_outdoor_station
    identify_device:
      id: identify_outdoor_station
      device_id: tc_bus_os
      name: "Identify"
      icon: "mdi:identifier"
      entity_category: CONFIG
      disabled_by_default: true
      web_server:
        sorting_group_id: sorting_group_outdoor_station_settings
        sorting_weight: -96

    read_memory:
      id: read_outdoor_station_memory
      device_id: tc_bus_os
      name: "Read Memory"
      icon: "mdi:file-arrow-up-down"
      entity_category: CONFIG
      disabled_by_default: true
      web_server:
        sorting_group_id: sorting_group_outdoor_station_settings
        sorting_weight: -95