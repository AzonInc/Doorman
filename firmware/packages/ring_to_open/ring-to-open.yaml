# Ring To Open Addon

globals:
  - id: rto_entrance_door_timer_remaining
    type: int
    restore_value: true
    initial_value: '0'

  - id: rto_second_entrance_door_timer_remaining
    type: int
    restore_value: true
    initial_value: '0'

  - id: rto_apartment_door_timer_remaining
    type: int
    restore_value: true
    initial_value: '0'

interval:
  - interval: 10s
    then:
      - lambda: |-
          if(!id(rto_entrance_door).state || id(rto_entrance_door_timer_remaining) <= 0)
          {
            return;
          }
          id(rto_entrance_door_timer_remaining) -= 10;
          if(id(rto_entrance_door_timer_remaining) % 60 == 0)
          {
            ESP_LOGD("RTO", "Entrance Door timer: %d minutes remaining", id(rto_entrance_door_timer_remaining) / 60);
          }
          if(id(rto_entrance_door_timer_remaining) <= 0)
          {
            ESP_LOGD("RTO", "Entrance Door timer elapsed");
            id(rto_entrance_door).turn_off();
          }

      - lambda: |-
          if(!id(rto_second_entrance_door).state || id(rto_second_entrance_door_timer_remaining) <= 0)
          {
            return;
          }
          id(rto_second_entrance_door_timer_remaining) -= 10;
          if(id(rto_second_entrance_door_timer_remaining) % 60 == 0)
          {
            ESP_LOGD("RTO", "Second Entrance Door timer: %d minutes remaining", id(rto_second_entrance_door_timer_remaining) / 60);
          }
          if(id(rto_second_entrance_door_timer_remaining) <= 0)
          {
            ESP_LOGD("RTO", "Second Entrance Door timer elapsed");
            id(rto_second_entrance_door).turn_off();
          }

      - lambda: |-
          if(!id(rto_apartment_door).state || id(rto_apartment_door_timer_remaining) <= 0)
          {
            return;
          }
          id(rto_apartment_door_timer_remaining) -= 10;
          if(id(rto_apartment_door_timer_remaining) % 60 == 0)
          {
            ESP_LOGD("RTO", "Apartment Door timer: %d minutes remaining", id(rto_apartment_door_timer_remaining) / 60);
          }
          if(id(rto_apartment_door_timer_remaining) <= 0)
          {
            ESP_LOGD("RTO", "Apartment Door timer elapsed");
            id(rto_apartment_door).turn_off();
          }

web_server:
  sorting_groups:
    - id: sorting_group_rto_settings
      name: "Ring To Open"
      sorting_weight: -75
    - id: sorting_group_rto_entrance
      name: "Ring To Open: Entrance Door"
      sorting_weight: 1
    - id: sorting_group_rto_central_toggle
      name: "Ring To Open: Central Toggle"
      sorting_weight: 2
    - id: sorting_group_rto_second_entrance
      name: "Ring To Open: Second Entrance Door"
      sorting_weight: 3
    - id: sorting_group_rto_apartment
      name: "Ring To Open: Apartment Door"
      sorting_weight: 4

binary_sensor:
  - id: !extend entrance_doorbell
    on_press:
      - if:
          condition:
            - switch.is_on: rto_entrance_door
            - lambda: !lambda 'return id(rto_entrance_door_pattern_condition)->current_option() == "single";'
          then:
            # Deactivate Ring To Open when Ring once is selected
            - if:
                condition:
                  - lambda: !lambda 'return id(rto_entrance_door_timeout_mode)->current_option() == "Ring once";'
                then:
                  - switch.turn_off: rto_entrance_door

            - if:
                condition:
                  - lambda: !lambda 'return id(rto_entrance_door_delay)->current_option() == "Random";'
                then:
                  - delay: !lambda "return 5000 + (rand() % 10000);"
                else:
                  - delay: !lambda |-
                      int milliseconds = std::stoi(id(rto_entrance_door_delay)->current_option()) * 1000;
                      return std::max(milliseconds, 300);

            - script.execute: rto_entrance_door_action

  - id: !extend second_entrance_doorbell
    on_press:
      - if:
          condition:
            - switch.is_on: rto_second_entrance_door
            - lambda: !lambda 'return id(rto_second_entrance_door_pattern_condition)->current_option() == "single";'
          then:
            # Deactivate Ring To Open when Ring once is selected
            - if:
                condition:
                  - lambda: !lambda 'return id(rto_second_entrance_door_timeout_mode)->current_option() == "Ring once";'
                then:
                  - switch.turn_off: rto_second_entrance_door

            - if:
                condition:
                  - lambda: !lambda 'return id(rto_second_entrance_door_delay)->current_option() == "Random";'
                then:
                  - delay: !lambda "return 5000 + (rand() % 10000);"
                else:
                  - delay: !lambda |-
                      int milliseconds = std::stoi(id(rto_second_entrance_door_delay)->current_option()) * 1000;
                      return std::max(milliseconds, 300);

            - script.execute: rto_second_entrance_door_action

  - id: !extend apartment_doorbell
    on_press:
      - if:
          condition:
            - switch.is_on: rto_apartment_door
            - lambda: !lambda 'return id(rto_apartment_door_pattern_condition)->current_option() == "single";'
          then:
            # Deactivate Ring To Open when Ring once is selected
            - if:
                condition:
                  - lambda: !lambda 'return id(rto_apartment_door_timeout_mode)->current_option() == "Ring once";'
                then:
                  - switch.turn_off: rto_apartment_door

            - if:
                condition:
                  - lambda: !lambda 'return id(rto_apartment_door_delay)->current_option() == "Random";'
                then:
                  - delay: !lambda "return 5000 + (rand() % 10000);"
                else:
                  - delay: !lambda |-
                      int milliseconds = std::stoi(id(rto_second_entrance_door_delay)->current_option()) * 1000;
                      return std::max(milliseconds, 0);

            - script.execute: rto_apartment_door_action

  - id: !extend doorman_external_button
    on_press:
      - if:
          condition:
            - lambda: !lambda 'return id(rto_toggle_trigger)->current_option() == "External Button";'
          then:
            - switch.toggle: rto_central
            - delay: 300ms

            # Confirm Ring To Open activation
            # Ring Apartment Doorbell once
            - if: 
                condition:
                  - switch.is_on: rto_central
                  - switch.is_on: rto_confirmation
                then:
                  - tc_bus_device.send:
                      id: tc_bus_indoor_station
                      type: floor_call

  - id: !extend function_button
    on_press:
      - if:
          condition:
            - lambda: !lambda 'return id(rto_toggle_trigger)->current_option() == "Function Button";'
          then:
            - switch.toggle: rto_central
            - delay: 300ms

            # Confirm Ring To Open activation
            # Ring Apartment Doorbell once
            - if: 
                condition:
                  - switch.is_on: rto_central
                  - switch.is_on: rto_confirmation
                then:
                  - tc_bus_device.send:
                      id: tc_bus_indoor_station
                      type: floor_call

            # Reset outdoor stations
            # to prevent address conflict
            - tc_bus.send:
                type: select_device_group_reset
                payload: 2


event:
  - id: !extend entrance_doorbell_pattern
    on_event:
      # Ring To Open Action
      - if:
          condition:
            - switch.is_on: rto_entrance_door
            - lambda: !lambda 'return event_type.c_str() != "single";'
            - lambda: !lambda 'return event_type.c_str() == id(rto_entrance_door_pattern_condition)->current_option();'
          then:
            # Deactivate Ring To Open when Ring once is selected
            - if:
                condition:
                  - lambda: !lambda 'return id(rto_entrance_door_timeout_mode)->current_option() == "Ring once";'
                then:
                  - switch.turn_off: rto_entrance_door

            - if:
                condition:
                  - lambda: !lambda 'return id(rto_entrance_door_delay)->current_option() == "Random";'
                then:
                  - delay: !lambda "return 5000 + (rand() % 10000);"
                else:
                  - delay: !lambda |-
                      int seconds = std::stoi(id(rto_entrance_door_delay)->current_option());
                      return (std::max(seconds, 2) - 2) * 1000;

            - script.execute: rto_entrance_door_action


  - id: !extend second_entrance_doorbell_pattern
    on_event:
      # Ring To Open Action
      - if:
          condition:
            - switch.is_on: rto_second_entrance_door
            - lambda: !lambda 'return event_type.c_str() != "single";'
            - lambda: !lambda 'return event_type.c_str() == id(rto_second_entrance_door_pattern_condition)->current_option();'
          then:
            # Deactivate Ring To Open when Ring once is selected
            - if:
                condition:
                  - lambda: !lambda 'return id(rto_second_entrance_door_timeout_mode)->current_option() == "Ring once";'
                then:
                  - switch.turn_off: rto_second_entrance_door

            - if:
                condition:
                  - lambda: !lambda 'return id(rto_second_entrance_door_delay)->current_option() == "Random";'
                then:
                  - delay: !lambda "return 5000 + (rand() % 10000);"
                else:
                  - delay: !lambda |-
                      int seconds = std::stoi(id(rto_second_entrance_door_delay)->current_option());
                      return (std::max(seconds, 2) - 2) * 1000;

            - script.execute: rto_second_entrance_door_action

  - id: !extend apartment_doorbell_pattern
    on_event:
      # Ring To Open Action
      - if:
          condition:
            - switch.is_on: rto_apartment_door
            - lambda: !lambda 'return event_type.c_str() != "single";'
            - lambda: !lambda 'return event_type.c_str() == id(rto_apartment_door_pattern_condition)->current_option();'
          then:
            # Deactivate Ring To Open when Ring once is selected
            - if:
                condition:
                  - lambda: !lambda 'return id(rto_apartment_door_timeout_mode)->current_option() == "Ring once";'
                then:
                  - switch.turn_off: rto_apartment_door

            - if:
                condition:
                  - lambda: !lambda 'return id(rto_apartment_door_delay)->current_option() == "Random";'
                then:
                  - delay: !lambda "return 5000 + (rand() % 10000);"
                else:
                  - delay: !lambda |-
                      int seconds = std::stoi(id(rto_apartment_door_delay)->current_option());
                      return (std::max(seconds, 2) - 2) * 1000;

            - script.execute: rto_apartment_door_action

switch:
  # Global Setting
  - platform: template
    id: rto_central
    device_id: tc_bus_is
    name: "Ring To Open"
    icon: "mdi:checkbox-marked-circle-auto-outline"
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: |-
      if(id(rto_central_doors)->current_option() == "Entrance") {
        return id(rto_entrance_door).state;
      } else if(id(rto_central_doors)->current_option() == "Second Entrance") {
        return id(rto_second_entrance_door).state;
      } else if(id(rto_central_doors)->current_option() == "Any Entrance") {
        return id(rto_entrance_door).state || id(rto_second_entrance_door).state;
      } else if(id(rto_central_doors)->current_option() == "Apartment") {
        return id(rto_apartment_door).state;
      } else if(id(rto_central_doors)->current_option() == "Any Entrance & Apartment") {
        return id(rto_entrance_door).state || id(rto_second_entrance_door).state || id(rto_apartment_door).state;
      }
      return false;
    turn_on_action:
      - lambda: |-
          if(id(rto_central_doors)->current_option() == "Entrance") {
            id(rto_entrance_door).turn_on();
          } else if(id(rto_central_doors)->current_option() == "Second Entrance") {
            id(rto_second_entrance_door).turn_on();
          } else if(id(rto_central_doors)->current_option() == "Any Entrance") {
            id(rto_entrance_door).turn_on();
            id(rto_second_entrance_door).turn_on();
          } else if(id(rto_central_doors)->current_option() == "Apartment") {
            id(rto_apartment_door).turn_on();
          } else if(id(rto_central_doors)->current_option() == "Any Entrance & Apartment") {
            id(rto_entrance_door).turn_on();
            id(rto_second_entrance_door).turn_on();
            id(rto_apartment_door).turn_on();
          }
    turn_off_action:
      - lambda: |-
          if(id(rto_central_doors)->current_option() == "Entrance") {
            id(rto_entrance_door).turn_off();
          } else if(id(rto_central_doors)->current_option() == "Second Entrance") {
            id(rto_second_entrance_door).turn_off();
          } else if(id(rto_central_doors)->current_option() == "Any Entrance") {
            id(rto_entrance_door).turn_off();
            id(rto_second_entrance_door).turn_off();
          } else if(id(rto_central_doors)->current_option() == "Apartment") {
            id(rto_apartment_door).turn_off();
          } else if(id(rto_central_doors)->current_option() == "Any Entrance & Apartment") {
            id(rto_entrance_door).turn_off();
            id(rto_second_entrance_door).turn_off();
            id(rto_apartment_door).turn_off();
          }
    web_server:
      sorting_group_id: sorting_group_controls
      sorting_weight: 5

  # Setting for each Door - Entrance Door
  - platform: template
    id: rto_entrance_door
    device_id: tc_bus_is
    name: "RTO: Entrance Door"
    icon: "mdi:checkbox-marked-circle-auto-outline"
    restore_mode: RESTORE_DEFAULT_OFF
    disabled_by_default: true
    optimistic: true
    turn_on_action:
      - lambda: |-
          std::string opt = id(rto_entrance_door_timeout_mode)->current_option();
          if (opt == "Never" || opt == "Ring once") return;
          int minutes = std::stoi(opt);
          id(rto_entrance_door_timer_remaining) = minutes * 60;
          ESP_LOGD("RTO", "Apartment timer set: %d minutes", minutes);
    turn_off_action:
      - globals.set:
          id: rto_entrance_door_timer_remaining
          value: '0'
    on_turn_on:
      - script.execute: update_rto_status
    on_turn_off:
      - script.execute: update_rto_status
    web_server:
      sorting_group_id: sorting_group_rto_entrance
      sorting_weight: -80

  # Setting for each Door - Second Entrance Door
  - platform: template
    id: rto_second_entrance_door
    device_id: tc_bus_is
    name: "RTO: Second Entrance Door"
    icon: "mdi:checkbox-marked-circle-auto-outline"
    restore_mode: RESTORE_DEFAULT_OFF
    disabled_by_default: true
    optimistic: true
    turn_on_action:
      - lambda: |-
          std::string opt = id(rto_second_entrance_door_timeout_mode)->current_option();
          if (opt == "Never" || opt == "Ring once") return;
          int minutes = std::stoi(opt);
          id(rto_second_entrance_door_timer_remaining) = minutes * 60;
          ESP_LOGD("RTO", "Apartment timer set: %d minutes", minutes);
    turn_off_action:
      - globals.set:
          id: rto_second_entrance_door_timer_remaining
          value: '0'
    on_turn_on:
      - script.execute: update_rto_status
    on_turn_off:
      - script.execute: update_rto_status
    web_server:
      sorting_group_id: sorting_group_rto_second_entrance
      sorting_weight: -70

  # Setting for each Door - Apartment Door
  - platform: template
    id: rto_apartment_door
    device_id: tc_bus_is
    name: "RTO: Apartment Door"
    icon: "mdi:checkbox-marked-circle-auto-outline"
    disabled_by_default: true
    internal: true
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    turn_on_action:
      - lambda: |-
          std::string opt = id(rto_apartment_door_timeout_mode)->current_option();
          if (opt == "Never" || opt == "Ring once") return;
          int minutes = std::stoi(opt);
          id(rto_apartment_door_timer_remaining) = minutes * 60;
          ESP_LOGD("RTO", "Apartment timer set: %d minutes", minutes);
    turn_off_action:
      - globals.set:
          id: rto_apartment_door_timer_remaining
          value: '0'
    on_turn_on:
      - script.execute: update_rto_status
    on_turn_off:
      - script.execute: update_rto_status
    web_server:
      sorting_group_id: sorting_group_rto_apartment
      sorting_weight: -50

  # Global Setting for all Doors
  - platform: template
    id: rto_confirmation
    device_id: tc_bus_is
    name: "RTO: Confirmation"
    icon: "mdi:bell-check"
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    entity_category: CONFIG
    disabled_by_default: true
    web_server:
      sorting_group_id: sorting_group_rto_settings
      sorting_weight: -100

  # Global Setting for all Doors
  - platform: template
    id: rto_led_status
    device_id: tc_bus_is
