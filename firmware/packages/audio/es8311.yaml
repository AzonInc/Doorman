# Audio Addon

esp32:
  framework:
    components:
      # Required for AEC (esp_aec component)
      - espressif/esp-sr^2.3.0

external_components:
  - source: github://n-IA-hane/intercom-api
    components: [intercom_api, i2s_audio_duplex, esp_aec]


script:
  - id: !extend boot_component_init
    then:
      # Configure ES8311 for digital feedback AEC
      # Register 0x44 bits[6:4] = ADCDAT_SEL: 4 = DACL + ADC
      # This makes ASDOUT output stereo: L=DAC loopback (reference), R=ADC (mic)
      - lambda: |-
          ESP_LOGI("es8311", "Configuring ES8311 register 0x44 for digital feedback...");
          // ES8311 I2C address is 0x18
          // First read current value
          uint8_t reg = 0x44;
          uint8_t current_val = 0;
          id(i2c_bus).write(0x18, &reg, 1);
          id(i2c_bus).read(0x18, &current_val, 1);
          ESP_LOGI("es8311", "Register 0x44 current value: 0x%02X", current_val);

          // Write new value: bits[6:4]=4 (DACL+ADC)
          uint8_t data[2] = {0x44, 0x48};
          auto err = id(i2c_bus).write(0x18, data, 2);
          if (err == esphome::i2c::ERROR_OK) {
            ESP_LOGI("es8311", "Wrote register 0x44=0x48 for digital feedback AEC");
            // Verify
            id(i2c_bus).write(0x18, &reg, 1);
            id(i2c_bus).read(0x18, &current_val, 1);
            ESP_LOGI("es8311", "Register 0x44 after write: 0x%02X", current_val);
          } else {
            ESP_LOGE("es8311", "Failed to write register 0x44: error %d", (int)err);
          }

      # Restore ES8311 volume and sync AEC reference
      - lambda: |-
          float vol = 0.15 + (id(speaker_volume).state / 100.0) * 0.60;
          id(es8311_dac).set_volume(vol);
          
          // AEC reference must match ES8311 hardware output level
          id(i2s_duplex).set_aec_reference_volume(vol);

# Setup ES8311
audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: i2c_bus
    use_mclk: true
    use_microphone : false
    bits_per_sample: 16bit
    sample_rate: 16000
    mic_gain: 24DB # Default 42DB is too hot. Try 24DB first.

# Setup I²S
i2s_audio_duplex:
  id: i2s_duplex
  i2s_lrclk_pin: GPIO18
  i2s_bclk_pin: GPIO17
  i2s_mclk_pin: GPIO7
  i2s_din_pin: GPIO15
  i2s_dout_pin: GPIO16
  aec_id: aec_component
  sample_rate: 48000
  output_sample_rate: 16000
  use_stereo_aec_reference: true
  reference_channel: left    # which I2S slot carries the DAC feedback
  mic_channel: right         # which I2S slot carries your mic

# Setup AEC
esp_aec:
  id: aec_component
  sample_rate: 16000
  filter_length: 4     # 64ms echo tail (sufficient for integrated codec)
  mode: voip_low_cost # High performance AEC for better echo cancellation



# Setup Microphone
microphone:
  - platform: i2s_audio_duplex
    id: mic_component
    i2s_audio_duplex_id: i2s_duplex

# Setup Speaker
speaker:
  - platform: i2s_audio_duplex
    id: spk_component
    i2s_audio_duplex_id: i2s_duplex

# Setup Intercom API
intercom_api:
  id: intercom
  mode: simple
  microphone: mic_component
  speaker: spk_component




button:
  # Smart Call button: idle→call, ringing→answer, streaming→hangup
  - platform: template
    id: call_button
    name: "Call"
    icon: "mdi:phone"
    on_press:
      - intercom_api.call_toggle:
          id: intercom

  # Decline incoming call
  - platform: template
    id: decline_button
    name: "Decline"
    icon: "mdi:phone-hangup"
    on_press:
      - intercom_api.decline_call:
          id: intercom


switch:
  - platform: i2s_audio_duplex
    i2s_audio_duplex_id: i2s_duplex
    aec:
      id: aec_switch
      name: "Echo Cancellation"
      restore_mode: RESTORE_DEFAULT_ON


number:
  - platform: intercom_api
    intercom_api_id: intercom
    mic_gain:
      id: mic_gain
      name: "Mic Gain"

  # Speaker volume with ES8311 hardware control (different from intercom_api volume)
  # IMPORTANT: Also sync to i2s_duplex for AEC reference scaling
  - platform: template
    id: speaker_volume
    name: "Speaker Volume"
    icon: "mdi:volume-high"
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 50
    optimistic: true
    restore_value: true
    unit_of_measurement: "%"
    set_action:
      - lambda: |-
          // ES8311 volume range: 0.15 (min) to 0.75 (max)
          float es8311_vol = 0.15 + (x / 100.0) * 0.60;
          id(es8311_dac).set_volume(es8311_vol);

          // AEC reference must match ES8311 hardware output level
          // This ensures reference amplitude matches actual echo picked up by mic
          id(i2s_duplex).set_aec_reference_volume(es8311_vol);