name: Close stale issues

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          days-before-issue-stale: 23
          days-before-issue-close: 7
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: stale
          exempt-issue-labels: pinned,security
          remove-issue-stale-when-updated: true
          stale-issue-message: >
            This issue has been automatically marked as stale because there has been
            no activity for 23 days. It will be closed in 7 days if no further
            activity occurs. If the issue is still relevant, please leave a comment.
          close-issue-message: >
            This issue has been closed due to inactivity. Feel free to reopen it
            or create a new issue if the problem persists.
          close-issue-reason: not_planned
          operations-per-run: 100
